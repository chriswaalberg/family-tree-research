<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Workshop demo, phone</title>
<!-- An iPhone (393×852 pt screen) with the Workshop open in Safari, for the phone version of the demo video.
     record.mjs drives it with MODE=phone and the same timeline as desktop.html; only `open` shows something here. -->
<style>
[hidden]{display:none!important}*{box-sizing:border-box}
html,body{margin:0;width:520px;height:960px;overflow:hidden;background:#141413;font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}
.phone{position:absolute;left:50%;top:50%;width:417px;height:876px;margin:-438px 0 0 -208.5px;border-radius:66px;background:#2b2b2d;
 box-shadow:0 0 0 1.5px #4a4a4d,inset 0 0 0 1.5px #111,0 30px 80px rgba(0,0,0,.55)}
.phone:before,.phone:after{content:"";position:absolute;width:4px;border-radius:2px;background:#3a3a3c}
.phone:before{left:-4px;top:170px;height:62px;box-shadow:0 80px 0 #3a3a3c}.phone:after{right:-4px;top:220px;height:96px}
.scr{position:absolute;inset:12px;border-radius:55px;overflow:hidden;background:#1a1a19;display:flex;flex-direction:column}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:3}
.sb{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0 50px;color:#fff;font-weight:600;font-size:17px;background:#1a1a19;position:relative;z-index:2}
.sb .r{display:flex;align-items:center;gap:6px}.sb svg{display:block;fill:#fff}
.bat{width:26px;height:12.5px;border:1.3px solid rgba(255,255,255,.45);border-radius:4px;padding:1.3px;position:relative}.bat i{display:block;height:100%;width:78%;background:#fff;border-radius:1.6px}
.bat:after{content:"";position:absolute;right:-3.6px;top:3.2px;width:1.8px;height:4.2px;border-radius:0 1px 1px 0;background:rgba(255,255,255,.45)}
.view{flex:1;position:relative}#ws{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .5s}#ws.on{opacity:1}
.bar{height:84px;flex:none;background:rgba(28,28,30,.96);border-top:.5px solid #333;padding:8px 14px 0;position:relative;z-index:2}
.url{height:44px;border-radius:13px;background:#3a3a3c;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:16px}
.url small{color:#9a9a9e;font-size:13px}
.home{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#fff}
</style></head><body>
<div class="phone"><div class="scr">
 <div class="island"></div>
 <div class="sb"><span>19:36</span><span class="r">
  <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4 10.3 10.3 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.8 6.8 0 0 0 8 4a6.8 6.8 0 0 0-4.6 1.8l1.2 1.3A5 5 0 0 1 8 5.8Zm0 3.5c.5 0 1 .2 1.3.5L8 11.2 6.7 9.8c.3-.3.8-.5 1.3-.5Z"/></svg>
  <span class="bat"><i></i></span></span></div>
 <div class="view"><iframe id="ws" title="Workshop"></iframe></div>
 <div class="bar"><div class="url"><small>ᴀA</small>&nbsp;192.168.1.24</div><div class="home"></div></div>
</div></div>
<script>
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
window.demo={
 opened:0,
 async type(text,ms=28){await wait(text.length*ms*1.15)},
 send(){},say(){},ran(){},todos(){},step(){},card(){},finish(){},think(){},
 open(url){const f=$("#ws");f.onload=()=>f.classList.add("on");f.src=url;demo.opened=Date.now()}
};
</script>
</body></html>
