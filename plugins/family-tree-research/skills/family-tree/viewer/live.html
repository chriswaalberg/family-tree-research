<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workshop</title>
<!-- The Workshop (Claude Code only): served by scripts/live.py, never published. It shows the start person's round Fan and
     animates every change in data.json; archives.py, delpher.py, gedcom_tool.py and `live.py note` send what Claude is doing. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f1e1d;--bg2:#33302c;--ink:#f5f4ef;--mut:#a39f96;--gold:#d97757;--gold2:#f4bfa2;--accent:#d97757;--star:#f6e7dc;
 --teal:#7fc8b4;--red:#e5594f;--amber:#e8a24a;--blue:#9db4e0;
 --slot:rgba(255,255,255,.04);--slotS:rgba(255,255,255,.13);--ghost:rgba(255,255,255,.10);--panel:rgba(38,37,35,.88);--line:rgba(255,255,255,.08);
 --fa:rgba(255,255,255,.055);--mo:rgba(217,119,87,.07);--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important} /* a display rule must never show a hidden box (the empty 'Working on' bar) */
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse 80% 70% at 38% 48%,var(--bg2),var(--bg) 72%) fixed;color:var(--ink);font:14px/1.45 var(--sans);
 display:grid;grid-template-rows:auto 1fr;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#stars,#fx{position:fixed;inset:0;pointer-events:none}#stars{z-index:0;transition:opacity .8s}#fx{z-index:50}
header,main{position:relative;z-index:1}
header{display:flex;align-items:center;gap:10px 22px;padding:12px 20px 6px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.hbtns{display:flex;gap:6px;align-self:flex-start}
.brand h1{font:700 28px/1 var(--serif);margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rootbtn{font:italic 500 17px var(--serif);color:var(--mut);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left}
.rootbtn b{font-style:normal;font-weight:700;color:var(--ink);border-bottom:1px dashed var(--mut)}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 10px var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);padding:4px 9px;border-radius:99px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.on i{background:var(--accent);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 0%,transparent)}}
.hbtn{font:600 12px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;text-decoration:none}
.hbtn:hover{border-color:var(--gold)}.hbtn{white-space:nowrap}
.counts{display:flex;gap:8px;margin-left:auto}
.cnt{min-width:84px;padding:5px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.cnt b{display:block;font:700 27px/1 var(--serif)}
.cnt span{display:block;font:600 9.5px var(--sans);letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar{width:100%}.cb-bar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--line)}
.cb-bar i{display:block;height:100%;transition:width 1.2s cubic-bezier(.3,.8,.3,1)}
.cb-bar .z{background:var(--gold)}.cb-bar .w{background:color-mix(in srgb,var(--gold) 55%,transparent)}.cb-bar .p{background:color-mix(in srgb,var(--gold) 28%,transparent)}
.cb-bar .x{background:var(--red)}.cb-bar .n{background:transparent}
.cb-lg{display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:4px;font:600 10px var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.cb-lg b{color:var(--ink);font-weight:700}.cbar.bump .cb-bar{animation:cbump 1.4s ease-out}@keyframes cbump{0%{box-shadow:0 0 18px var(--gold)}100%{}}
.slot.nada{animation:nada 1.8s ease-out}@keyframes nada{0%{fill:rgba(160,160,160,.35);stroke:var(--mut);stroke-width:2}100%{}}
.lk.shine{animation:shine 2.2s ease-out}@keyframes shine{0%{stroke:var(--gold2);stroke-opacity:1;stroke-width:5}100%{}}
.cnt.bump b{animation:bump 1.1s ease-out}.cnt.down b{animation:down 1.1s ease-out}
@keyframes bump{0%{color:var(--gold2);text-shadow:0 0 18px var(--gold)}100%{}}
@keyframes down{0%{color:var(--red)}100%{}}
main{display:grid;grid-template-columns:1fr minmax(300px,370px);min-height:0}
#stage{position:relative;min-height:0}
#fan{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
aside{display:flex;flex-direction:column;gap:10px;padding:6px 18px 14px 0;min-height:0}
#src:empty,#tasks:empty{display:none}
#rbar{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border:1px solid var(--accent);border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
#rbar .rb-t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}#rbar .rb-t b{font:700 16px var(--serif)}#rbar .rb-t span{font:600 11px var(--sans);color:var(--mut)}
#rbar .rb-bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}#rbar .rb-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
#rbar .rb-c{display:flex;gap:6px;flex-wrap:wrap}#rbar button{font:600 12px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
#rbar button.on{background:var(--accent);border-color:var(--accent);color:#1f1e1d}#rbLive{margin-left:auto}
#now{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:14px;background:var(--panel)}
#now h3{margin:0;font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
#now .nw{display:flex;gap:9px;align-items:center;min-width:0}#now .nw i{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor;animation:orbPulse 2s ease-in-out infinite}
#now .nw span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}#now .nw b{font:700 16px var(--serif);color:var(--ink)}
#now .nw em{font:600 9.5px var(--sans);font-style:normal;letter-spacing:1px;text-transform:uppercase;margin-left:8px;color:var(--mut)}
.focus{pointer-events:none}.fring{fill:none;stroke-width:2.2;transform-box:fill-box;transform-origin:center;animation:fpulse 1.8s ease-in-out infinite}
@keyframes fpulse{50%{transform:scale(1.45);opacity:.45}}
.flbl,.frel{text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.flbl{font-family:var(--serif);font-weight:700;fill:var(--ink)}.frel{font-family:var(--sans);fill:var(--mut)}
#tasks{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.task{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;transition:opacity .8s}
.task b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task span{font:600 11px var(--sans);color:var(--mut);white-space:nowrap}
.task small{grid-column:1/-1;color:var(--mut);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.task .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 10px var(--gold);transition:width .6s ease-out}
.task.done{opacity:0}
.card{position:relative;padding:12px 54px 12px 16px;border-radius:12px;color:var(--ink);
 background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 13%,transparent),color-mix(in srgb,var(--bg) 88%,transparent) 55%);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
 box-shadow:0 0 34px color-mix(in srgb,var(--gold) 14%,transparent),inset 0 1px 0 color-mix(in srgb,var(--gold2) 15%,transparent);transform-origin:top center;animation:unfold .9s cubic-bezier(.2,.9,.3,1.2)}
.card small{display:block;font:700 10px var(--sans);letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.card div{font:600 italic 18px/1.25 var(--serif);margin-top:3px;overflow-wrap:anywhere;color:var(--gold2)}
.card .srcl{display:flex;flex-direction:column;gap:2px}
.card .srcl a,.card .srcl .sl{color:var(--gold2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .srcl a span{font:600 12px var(--sans);color:var(--gold);opacity:.8}.card .srcl a:hover{text-decoration:underline}
.card .srcl em{font:600 11px var(--sans);font-style:normal;color:var(--mut);margin-top:2px}
.card .seal{position:absolute;right:14px;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;
 color:var(--gold2);font:700 13px var(--serif);box-shadow:0 0 16px color-mix(in srgb,var(--gold) 50%,transparent),inset 0 0 10px color-mix(in srgb,var(--gold) 35%,transparent);animation:seal 2.6s ease-in-out infinite}
@keyframes seal{50%{box-shadow:0 0 26px color-mix(in srgb,var(--gold) 80%,transparent),inset 0 0 14px color-mix(in srgb,var(--gold) 50%,transparent)}}
.card.none{background:color-mix(in srgb,var(--bg) 70%,transparent);border-color:var(--line);box-shadow:none}.card.none small{color:var(--mut)}.card.none div{color:var(--mut)}
@keyframes unfold{0%{transform:rotateX(-80deg) translateY(-24px);opacity:0}100%{transform:none;opacity:1}}
.feedwrap{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.feedwrap h2{margin:0;padding:9px 14px;font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
#feed{list-style:none;margin:0;padding:4px 0;overflow:auto;flex:1}
#feed li{display:flex;gap:10px;padding:7px 14px;border-left:3px solid transparent;animation:slide .45s ease-out}
#feed li.q{animation:none}
#feed li .ic{width:18px;flex:none;text-align:center;color:var(--mut)}
#feed li b{display:block;font-weight:600}
#feed li small{display:block;color:var(--mut);overflow-wrap:anywhere}
#feed li .who{display:inline-block;font:600 9.5px var(--sans);letter-spacing:1px;text-transform:uppercase;padding:1px 6px;border-radius:99px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
#feed li:last-child{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 10%,transparent),transparent)}
#feed .k-search,#feed .k-read,#feed .k-scan,#feed .k-clip{border-color:var(--blue)}#feed .k-result{border-color:var(--line)}
#feed .k-check{border-color:var(--teal)}#feed .k-warn{border-color:var(--amber)}#feed .k-add{border-color:var(--gold)}
#feed .k-del{border-color:var(--red)}#feed .k-cert{border-color:var(--gold2)}#feed .k-fix{border-color:var(--amber)}#feed .k-note,#feed .k-found{border-color:var(--mut)}
#feed .k-ask{border-color:var(--red)}#feed .k-focus{border-color:var(--accent)}#feed .k-nothing{border-color:var(--mut);opacity:.85}#feed .k-why{border-color:color-mix(in srgb,var(--gold) 50%,transparent)}#feed .k-rebuild{border-color:var(--teal)}
#feed .empty{color:var(--mut);font-style:italic;justify-content:center;border:0;background:none}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
/* fan */
.slot{fill:var(--slot);stroke:var(--slotS);stroke-width:1;transition:fill .8s,stroke .8s;cursor:pointer}
.cos .slot.star{fill:#f3e9df;stroke:none}.cos .slot.star.root{fill:#ffe9d6;stroke:var(--gold);stroke-width:2;stroke-opacity:.8}
.cos .slot.gap{fill:none;stroke:var(--gold);stroke-opacity:.45;stroke-dasharray:1.6 2.4;stroke-width:1}.cos .slot.gap.far{stroke-opacity:.18}
.cos .guide{stroke-opacity:.6}
.cos .lk{stroke-width:1.1;stroke-opacity:.5}.cos .lk:not(.z):not(.w):not(.p):not(.x){stroke:rgba(255,255,255,.4)}.cos .lk.z{stroke:var(--gold);stroke-width:1.5;stroke-opacity:.6}.cos .lk.w{stroke-width:1.3;stroke-opacity:.5}
.cos .halo{pointer-events:none}.cos .lbl text{dominant-baseline:auto}
.vsw{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.vsw button{font:600 12px var(--sans);color:var(--mut);background:var(--panel);border:0;padding:6px 10px;cursor:pointer}
.vsw button[aria-pressed=true]{color:var(--ink);background:color-mix(in srgb,var(--gold) 28%,var(--panel))}
.slot.fa{fill:var(--fa)}.slot.mo{fill:var(--mo)}
.slot.root{fill:color-mix(in srgb,var(--gold) 12%,transparent);stroke:var(--gold);stroke-opacity:.6}
.slot.gap{fill:none;stroke:var(--gold);stroke-opacity:.35;stroke-dasharray:3 5;cursor:default}
.calm .slot.gap{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{stroke-opacity:.9;fill:color-mix(in srgb,var(--gold) 7%,transparent)}}
.guide{fill:none;stroke:var(--ghost);stroke-dasharray:1 5;stroke-linecap:round}
.qm{fill:var(--gold);font:500 italic 16px var(--serif);text-anchor:middle;dominant-baseline:central;opacity:.5;pointer-events:none}
.calm .qm{animation:qm 3.4s ease-in-out infinite}
@keyframes qm{50%{opacity:.9}}
.lk{fill:none;stroke:var(--slotS);stroke-width:1.2;pointer-events:none}
.lk.w{stroke:var(--gold);stroke-opacity:.5;stroke-width:1.6;stroke-dasharray:5 5}.lk.p{stroke:var(--gold);stroke-opacity:.45;stroke-width:1.4;stroke-dasharray:1 4;stroke-linecap:round}
.lk.z{stroke:var(--gold);stroke-width:2;stroke-opacity:.55}.lk.x{stroke:var(--red);stroke-width:2;stroke-dasharray:4 3}
.lbl{pointer-events:none}.lbl text{text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.nm{font-family:var(--serif);font-weight:700}.yr{font-family:var(--sans);fill:var(--mut)!important}
.gl{font-family:var(--sans);font-weight:600}.gl .ok{fill:var(--teal)}.gl .wa{fill:var(--amber)}.gl .gg{fill:var(--gold)}
.pending{opacity:0}
.slot.scanned{animation:scan 1.3s ease-out}@keyframes scan{0%{fill:rgba(95,224,200,.5);stroke:var(--teal);stroke-width:2}100%{}}
.slot.gaphot{animation:gaphot 1.5s ease-out}@keyframes gaphot{0%{fill:color-mix(in srgb,var(--gold) 35%,transparent);stroke-opacity:1;stroke-width:2}100%{}}
.slot.warnflash{animation:warn 2.4s ease-out}@keyframes warn{0%,30%{fill:rgba(255,176,59,.55);stroke:var(--amber);stroke-width:2.5}100%{}}
.slot.ignite{animation:ign 2s ease-out}@keyframes ign{0%{fill:var(--gold2);stroke:var(--gold2);stroke-width:3}100%{}}
.lbl.mat{animation:mat 1.6s ease-out}@keyframes mat{0%{opacity:0;filter:blur(8px)}100%{opacity:1;filter:blur(0)}}
.lbl.out{transition:opacity .6s,filter .6s;opacity:0;filter:blur(6px)}
.slot.broken{fill:color-mix(in srgb,var(--red) 22%,transparent)!important;stroke:var(--red)!important;stroke-width:2!important}
.crack{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linejoin:bevel;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-in forwards;filter:drop-shadow(0 0 5px var(--red))}
@keyframes draw{to{stroke-dashoffset:0}}
.stamp{font:700 13px var(--sans);letter-spacing:3px;fill:color-mix(in srgb,var(--red) 12%,transparent);stroke:var(--red);stroke-width:1;text-anchor:middle;dominant-baseline:central;transform-box:fill-box;transform-origin:center;animation:thump .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes thump{0%{transform:scale(2.6);opacity:0}100%{transform:scale(1);opacity:1}}
.lk.flare{animation:flare 2.6s ease-out}@keyframes flare{0%{stroke:var(--gold2);stroke-width:12;filter:drop-shadow(0 0 16px var(--gold))}100%{}}
.lk.flarex{animation:flarex 2.6s ease-out}@keyframes flarex{0%{stroke:var(--red);stroke-width:10}100%{}}
.wave{fill:none;stroke:var(--gold);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:wave 1.3s ease-out forwards;pointer-events:none}
@keyframes wave{0%{transform:scale(.1);opacity:1;stroke-width:6}100%{transform:scale(1);opacity:0;stroke-width:.5}}
.beam{pointer-events:none;transition:opacity 1.2s}.beam.idle{opacity:0}
.beam text{font:600 12px var(--sans);letter-spacing:1px;text-anchor:middle;dominant-baseline:central}
.beam .tip{animation:tip 1.4s ease-in-out infinite}@keyframes tip{50%{opacity:.4}}
.fxfade{transition:opacity .7s;opacity:0}
/* tray, callouts, overlay */
#tray{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:6px;max-width:min(270px,60%)}
#tray h3{margin:0 0 2px;font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
#tray:not(.has){display:none}
.orb{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--panel);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);animation:orbIn .6s cubic-bezier(.2,1.4,.4,1);min-width:0}
.orb i{flex:none;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold2),var(--gold));box-shadow:0 0 14px var(--gold)}
.orb span{min-width:0}.orb b{display:block;font:700 14px/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.orb small{display:block;color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orb.rej{border-color:color-mix(in srgb,var(--red) 40%,transparent);opacity:.75}.orb.rej i{background:radial-gradient(circle at 35% 35%,#c9c3b8,#6d6a66);box-shadow:none}.orb.rej b{text-decoration:line-through;text-decoration-color:var(--red)}
@keyframes orbIn{from{transform:scale(.3);opacity:0}}
.flyer{position:fixed;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;z-index:60;pointer-events:none;background:radial-gradient(circle at 35% 35%,#fff,var(--gold2) 40%,var(--gold));box-shadow:0 0 30px 8px var(--gold)}
.bigg{position:fixed;left:0;top:0;z-index:60;pointer-events:none;font:700 50px var(--sans);color:var(--gold);text-shadow:0 0 24px var(--gold)}
.co{position:absolute;z-index:5;max-width:min(250px,70%);padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:13px;animation:pop .45s cubic-bezier(.2,1.5,.4,1);transition:opacity .6s;pointer-events:none}
.co b{display:block;font:700 15px var(--serif)}.co.amber{border-left-color:var(--amber)}.co.red{border-left-color:var(--red)}.co.teal{border-left-color:var(--teal)}
.co s{color:var(--red)}.co.bye{opacity:0}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);z-index:8;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s,transform .6s;width:max-content;max-width:92%}
#ov.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ov .box{padding:18px 28px;border-radius:18px;background:var(--panel);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);box-shadow:0 0 80px color-mix(in srgb,var(--gold) 18%,transparent)}
#ov h4{margin:0;font:700 30px var(--serif)}#ov p{margin:4px 0 0;color:var(--mut)}
#ov .st{display:flex;gap:20px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#ov .st b{display:block;font:700 30px/1 var(--serif);color:var(--gold)}#ov .st span{font:600 9.5px var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(420px,92vw);max-height:80vh}
.qr{background:#2a2826;padding:10px;border-radius:16px;width:min(250px,70vw);margin:14px auto 10px;box-shadow:0 0 40px color-mix(in srgb,var(--accent) 35%,transparent)}.qr svg{display:block;width:100%;height:auto}
#phoneDlg p{margin:6px 0;color:var(--mut)}#phoneDlg code{display:block;margin-top:8px;font-size:11px;color:var(--mut);overflow-wrap:anywhere}
#phoneDlg .x{float:right;background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 10px;font:700 22px var(--serif)}
dialog input{width:100%;font:15px var(--sans);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin:8px 0}
.plist{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}

/* ===== TUNING (all numbers that shape the Workshop) ===== */
let VIEW="cosmos";
const CFG={QR_STYLE:2,SRC_MAX:3,FOCUS_MS:120000,SWEEP_BIG:400,TICK_MS:120,TAP_PX:22,COS_R0:40,STEPS_ONE_BY_ONE:8,CERT_ONE_BY_ONE:4,WHY_ANIM_MAX:80,BREATHE_MAX:40,MAX_PARTS:1500,STAR_MS:250,MAXG:14,R0:62,RMAX:490,Q:.8,MIN_DEG:.12,ONE_BY_ONE:10,TRAY:6,BEAM_IDLE:30000,FEED:120,GAPS_TO:9,SWEEP_MS:5200,FLY_MS:1400};

/* ===== DATA ===== */
let D=null,P=[],ROOT=null,L=null;            // L = current layout
const checked=new Set(),warned=new Set(),trayIds=[];
const key=(p,i)=>p&&p.id?String(p.id).replace(/@/g,""):"#"+i;
const normS=s=>{s=String(s||"").toLowerCase().trim();for(const [k,a] of [["zeker",["certain"]],["waarschijnlijk",["probable","likely"]],["mogelijk",["possible"]],["fout",["wrong","error"]],["onbekend",["unknown"]]])if(s.startsWith(k)||a.includes(s))return k;if(s.startsWith("not checked"))return"niet gecheckt";return s};
const first=p=>((p.g||p.n||"").replace(/'[^']*'/g,"").trim().split(/\s+/)[0])||p.n||"?";
const short=p=>p?[first(p),p.s||""].join(" ").trim()||p.n:"?";
const yrs=p=>p.living?"":(p.by||p.dy)?`${p.by||"?"}${p.dy?"–"+p.dy:""}`:"";
function prep(d){const ps=d.personen||d.people||[];ps.forEach(p=>{if(p.f==null)p.f=-1;if(p.m==null)p.m=-1;if(!p.n)p.n=[p.g,p.s].filter(Boolean).join(" ")||"?";if(d.levenden_tonen===false&&p.levend)p.living=true;});return ps}
function idx(Pa,k){return Pa.findIndex((p,i)=>key(p,i)===k)}
function startKey(Pa,d){const s=(d.startpersonen||[])[0];const i=s==null?0:(typeof s==="number"?s:s.persoon);return Pa[i]?key(Pa[i],i):(Pa[0]?key(Pa[0],0):null)}
function counts(Pa,rootK){let r=0,s=0;for(const p of Pa){for(const x of["f","m"])if(p[x]>=0){r++;const c=p.c&&p.c[x];if(c&&c[1])s++;}}
 let g=0;const ri=idx(Pa,rootK);if(ri>=0){const seen=new Set();(function rec(i,gen){if(gen>=CFG.GAPS_TO)return;for(const x of["f","m"]){const j=Pa[i][x];if(j>=0){if(!seen.has(j+":"+gen)){seen.add(j+":"+gen);rec(j,gen+1)}}else g++}})(ri,1)}
 return{p:Pa.length,r,g,s}}

/* ===== LAYOUT: the round fan (father's side left, like the viewer) ===== */
const rad=d=>d*Math.PI/180,pt=(r,a)=>[r*Math.sin(rad(a)),-r*Math.cos(rad(a))];
function layout(Pa,rootK){const ri=idx(Pa,rootK),slots=new Map(),byId=new Map();let depth=0;if(ri<0)return{slots,byId,GR:1,RI:()=>0,RO:()=>CFG.R0};
 (function rec(i,code,g,a,b){const lo=Math.min(a,b),hi=Math.max(a,b),k=key(Pa[i],i);slots.set(code,{code,i,k,g,lo,hi});if(!byId.has(k))byId.set(k,[]);byId.get(k).push(code);depth=Math.max(depth,g);
  if(g>=CFG.MAXG||(g>0&&hi-lo<CFG.MIN_DEG*2))return;const p=Pa[i],m=(a+b)/2,F=code===""?[360,180]:[a,m],M=code===""?[0,180]:[m,b];
  if(p.f>=0)rec(p.f,code+"f",g+1,...F);if(p.m>=0)rec(p.m,code+"m",g+1,...M);})(ri,"",0,0,360);
 const GR=Math.max(1,Math.min(CFG.MAXG,depth+1)),Q=CFG.Q,w0=(CFG.RMAX-CFG.R0)*(1-Q)/(1-Math.pow(Q,GR)),st=(CFG.RMAX-CFG.COS_R0)/GR;
 const RI=VIEW==="cosmos"?(g=>g===0?0:CFG.COS_R0+(g-1)*st):(g=>g===0?0:CFG.R0+w0*(1-Math.pow(Q,g-1))/(1-Q)),
       RO=VIEW==="cosmos"?(g=>g===0?CFG.COS_R0:CFG.COS_R0+g*st):(g=>g===0?CFG.R0:RI(g)+w0*Math.pow(Q,g-1));
 const gaps=[];for(const s of slots.values()){if(s.g>=GR)continue;const p=Pa[s.i],m=(s.code===""?null:(s.code[0]==="f"?[s.lo,s.hi]:[s.lo,s.hi]));
  for(const x of["f","m"]){if(p[x]>=0)continue;let lo,hi;if(s.code===""){[lo,hi]=x==="f"?[180,360]:[0,180]}else{const [a,b]=dirOf(s);const mm=(a+b)/2;const r=x==="f"?[a,mm]:[mm,b];lo=Math.min(...r);hi=Math.max(...r)}
   if(hi-lo>=CFG.MIN_DEG)gaps.push({code:s.code+x,g:s.g+1,lo,hi});}}
 return{slots,byId,gaps,GR,RI,RO,depth}}
/* the direction a slot was cut in (father first): needed to cut a gap the same way as a parent would be */
function dirOf(s){let a=s.code[0]==="f"?360:0,b=180;for(let k=1;k<s.code.length;k++){const m=(a+b)/2;if(s.code[k]==="f")b=m;else a=m}return[a,b]}
function sector(r1,r2,lo,hi){const Lg=hi-lo>180?1:0,[x1,y1]=pt(r2,lo),[x2,y2]=pt(r2,hi),[x3,y3]=pt(r1,hi),[x4,y4]=pt(r1,lo);
 return`M${x1.toFixed(1)} ${y1.toFixed(1)}A${r2} ${r2} 0 ${Lg} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}L${x3.toFixed(1)} ${y3.toFixed(1)}A${r1} ${r1} 0 ${Lg} 0 ${x4.toFixed(1)} ${y4.toFixed(1)}Z`}
function arc(r,lo,hi){const[x1,y1]=pt(r,lo),[x2,y2]=pt(r,hi);return`M${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 ${hi-lo>180?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`}
function centre(s,Lx=L){if(!s||s.code==="")return[0,0];return pt((Lx.RI(s.g)+Lx.RO(s.g))/2,(s.lo+s.hi)/2)}
const svg=$("#fan");
function scr(x,y){const p=svg.createSVGPoint();p.x=x;p.y=y;const q=p.matrixTransform(svg.getScreenCTM());return[q.x,q.y]}
const codeOf=k=>{const c=L&&L.byId.get(k);return c?c[0]:null};
const slotAt=c=>c==null?null:L.slots.get(c);
const slotScr=c=>scr(...centre(slotAt(c)));
const segEl=c=>svg.querySelector(`.slot[data-c="${c}"]`),lblEl=c=>svg.querySelector(`.lbl[data-c="${c}"]`),lkEl=c=>svg.querySelector(`.lk[data-c="${c}"]`);

/* ===== RENDER ===== */
let lastCounts=null;
function render(pending){pending=pending||new Set();measure();L=layout(P,ROOT);const G=$("#fanG");let h="";G.classList.toggle("cos",VIEW==="cosmos");

 for(const q of L.gaps){h+=`<path class="slot gap" data-c="${q.code}" d="${sector(L.RI(q.g)+1,L.RO(q.g)-1,q.lo,q.hi)}"/>`;
  const [x,y]=centre(q),arcL=(L.RI(q.g)+L.RO(q.g))/2*rad(q.hi-q.lo);if(arcL>26&&L.RO(q.g)-L.RI(q.g)>20)h+=`<text class="qm" x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${fz(Math.min(17,arcL/2.5),11).toFixed(1)}px">?</text>`}
 for(const s of L.slots.values()){const pc=pending.has(s.k)?" pending":"";
  if(s.code===""){h+=`<circle class="slot root${pc}" data-c="" r="${CFG.R0}"/>`;continue}
  h+=`<path class="slot ${s.code[0]==="f"?"fa":"mo"}${pc}" data-c="${s.code}" d="${sector(L.RI(s.g)+.6,L.RO(s.g)-.6,s.lo+.15,s.hi-.15)}"/>`}
 for(const s of L.slots.values()){if(s.code==="")continue;const ch=L.slots.get(s.code.slice(0,-1)),c=P[ch.i].c&&P[ch.i].c[s.code.slice(-1)],st=normS(c&&c[0]);
  const cls=st==="zeker"?"z":st==="waarschijnlijk"?"w":st==="mogelijk"?"p":st==="fout"?"x":"";const pad=Math.min(1.2,(s.hi-s.lo)*.1);
  h+=`<path class="lk ${cls}${pending.has(s.k)?" pending":""}" data-c="${s.code}" d="${arc(L.RI(s.g),s.lo+pad,s.hi-pad)}"/>`}
 for(const s of L.slots.values())h+=label(s,pending.has(s.k));
 G.innerHTML=h;G.classList.toggle("calm",L.gaps.length<=CFG.BREATHE_MAX);
 renderTray();renderCounts();renderCert();renderTitle();drawFocus()}

function tgCounts(d){const m=new Map(),pl=(d&&d.tijdgeest&&d.tijdgeest.plaatsen)||[];
 for(const e of pl){const k=e.id||e.naam;if(k)m.set(k,{naam:e.naam||k,e:(e.gebeurtenissen||[]).length,b:(e.beelden||[]).length,l:(e.leven||[]).length})}return m}
const nameOfK=(Pa,k)=>{const i=idx(Pa,k);return i<0?"?":short(Pa[i])};
async function dataChanged(given){const d=given||await fetchData();if(!d)return;const oP=P,nP=prep(d),oTG=tgCounts(D);D=d;setLang(d);
 const ch=diffOf(oP,nP),oldL=L,oldFan=new Set(oldL.byId.keys());
 /* phase 1, on the old fan: links that went away crack, people that went away blow away */
 fxClear();
 for(const x of ch.linkDel){const cc=codeOf(x.c),pc=cc!=null?cc+x.s:null;feed("del",_t("unlinked",{p:nameOfK(oP,x.p),c:nameOfK(oP,x.c)}),"");
  if(pc!=null&&slotAt(pc)){beamAim("",pc);await crack(pc)}if(idx(nP,x.p)>=0)trayIds.push({k:x.p,rej:true,why:_t(x.s==="f"?"fatherOf":"motherOf",{c:nameOfK(nP,x.c)})})}
 for(const x of ch.removed){const c=codeOf(x.k),fn=fold(first(x.p)),sn=fold(x.p.s);
  const into=nP.findIndex(p=>fold(p.s)===sn&&(fold(p.n).includes(fn)||(p.aka||[]).some(a=>fold(a).includes(fn)))&&(!p.by||!x.p.by||Math.abs(p.by-x.p.by)<=5));
  if(into>=0){feed("fix",_t("merged",{a:short(x.p),b:short(nP[into])}),"");const tc=codeOf(key(nP[into],into));if(c!=null&&tc!=null){await fly(slotScr(c),tc);wave(tc)}}
  else{feed("del",_t("removed",{n:short(x.p)}),"");if(c!=null){const[sx,sy]=slotScr(c);ash(sx,sy,80);lblEl(c)?.classList.add("out");await wait(800)}}}
 /* phase 2: the new fan; newcomers start invisible and arrive one by one */
 P=nP;if(idx(P,ROOT)<0)ROOT=startKey(P,D);
 const newL=layout(P,ROOT),arrive=[...newL.byId.keys()].filter(k=>!oldFan.has(k)).sort((a,b)=>newL.slots.get(newL.byId.get(a)[0]).g-newL.slots.get(newL.byId.get(b)[0]).g);
 const trayPos=new Map($$("#tray .orb").map(o=>{const r=o.querySelector("i").getBoundingClientRect();return[o.dataset.k,[r.left+10,r.top+10]]}));
 fxClear();render(new Set(arrive));beamsReattach();
 if(newL.depth>oldL.depth&&oldL.slots.size){feed("add",_t("ring"),_t("ringD"))}
 const viaLink=new Map(ch.linkAdd.map(x=>[x.p,x]));let shown=0;
 for(const k of arrive){const c=codeOf(k),x=viaLink.get(k),i=idx(P,k),isNew=ch.added.includes(k);
  const ci=x?idx(P,x.c):-1,rel=x?_t(x.s==="f"?"fatherOf":"motherOf",{c:short(P[ci])}):"";
  if(shown<CFG.ONE_BY_ONE){shown++;feed("add",_t(isNew?"added":"linked",{n:short(P[i])}),[yrs(P[i]),rel,x&&x.st?_t("s_"+x.st):""].filter(Boolean).join(" · "));
   showSource(x?x.src:"");await wait(500);const from=trayPos.get(k)||srcPt()||scr(0,0);if(!trayPos.has(k)&&srcPt())await streamTo(srcPt(),slotScr(c),700);
   beamAim("",c);await fly(from,c);ignite(c);
   if(x&&x.st&&x.st!=="zeker"&&x.st!=="niet gecheckt")callout(c,`<b>${esc(_t("s_"+x.st))}</b>${esc(rel)}`,"",3200);await wait(450)}
  else $$(`[data-c="${c}"]`).forEach(e=>e.classList.remove("pending"))}
 if(arrive.length>CFG.ONE_BY_ONE){feed("add",_t("many",{n:arrive.length-CFG.ONE_BY_ONE}),"");wave("",css("--gold2"));await wait(900)}
 if(arrive.length){const nGaps=L.gaps.filter(q=>arrive.includes(L.slots.get(q.code.slice(0,-1))?.k)).length;
  if(nGaps){for(const q of L.gaps)if(arrive.includes(L.slots.get(q.code.slice(0,-1))?.k))flash(segEl(q.code),"gaphot");callout(L.gaps.find(q=>arrive.includes(L.slots.get(q.code.slice(0,-1))?.k))?.code,`<b>${esc(_t("gapsNew",{n:nGaps}))}</b>${esc(_t("gapsNewD"))}`,"teal",3800);await wait(1200)}}
 /* new people outside the fan go to the tray */
 for(const k of ch.added){if(codeOf(k)!=null)continue;const i=idx(P,k);trayIds.push({k,why:_t("notInFan")});feed("add",_t("added",{n:short(P[i])}),[yrs(P[i]),_t("notInFan")].filter(Boolean).join(" · "))}
 if(ch.added.some(k=>codeOf(k)==null)){renderTray();$$("#tray .orb").forEach(o=>{const r=o.querySelector("i").getBoundingClientRect();burst(r.left+10,r.top+10,30,css("--gold"),2.5)})}
 if(ch.cert.length>CFG.CERT_ONE_BY_ONE){const rest=ch.cert.splice(CFG.CERT_ONE_BY_ONE);feed("cert",_t("certN",{n:rest.length+CFG.CERT_ONE_BY_ONE}),"");
  for(const x of rest){const cc=codeOf(x.c),pc=cc!=null?cc+x.s:null;if(pc!=null&&slotAt(pc))flash(lkEl(pc),x.to==="fout"?"flarex":"flare")}await wait(1200)}
 for(const x of ch.cert){const cc=codeOf(x.c),pc=cc!=null?cc+x.s:null;feed("cert",_t("cert",{p:nameOfK(P,x.c),c:nameOfK(P,x.p),s:_t("s_"+x.to)}),_t("certFrom",{s:_t("s_"+(x.from||""))})+(x.src?" · "+x.src:""));
  if(pc==null||!slotAt(pc))continue;if(x.src)showSource(x.src);beamAim("",pc);const s=slotAt(pc);
  if(x.to==="fout"){flash(lkEl(pc),"flarex");const[sx,sy]=slotScr(pc);burst(sx,sy,40,css("--red"),3)}
  else{flash(lkEl(pc),"flare");for(let n=0;n<=12;n++){const[x2,y2]=scr(...pt(L.RI(s.g),s.lo+(s.hi-s.lo)*n/12));burst(x2,y2,7,css("--gold2"),1.8,55);await wait(35)}}
  callout(pc,`<b>${esc(_t("s_"+x.to))}</b>${x.to==="zeker"?esc(_t("gold")):""}`,x.to==="fout"?"red":"",3400);await wait(900)}
 if(ch.why.length){const names=[...new Set(ch.why.map(x=>nameOfK(P,x.p)))];
  if(ch.why.length<=3){for(const x of ch.why)feed("why",_t("why",{c:nameOfK(P,x.c),p:nameOfK(P,x.p)}),x.why||x.src)}
  else feed("why",_t("whyN",{n:ch.why.length}),_t("whyNd",{names:names.slice(0,3).join(", ")}));
  const first=ch.why.find(x=>x.src||x.why);if(first)showSource(first.src||first.why);
  let k=0;for(const x of ch.why){const cc=codeOf(x.c),pc=cc!=null?cc+x.s:null;if(pc==null||!slotAt(pc))continue;if(k++>=CFG.WHY_ANIM_MAX)break;
   setTimeout(()=>{flash(lkEl(pc),"shine");if(k<30){const s=slotAt(pc),[x2,y2]=scr(...pt(L.RI(s.g),(s.lo+s.hi)/2));burst(x2,y2,8,css("--gold2"),1.6,45)}},Math.min(2400,k*35))}
  await wait(Math.min(2800,600+k*35))}
 for(const k of ch.storyEdit){feed("found",_t("storyEdit",{n:nameOfK(P,k)}),"");const c=codeOf(k);if(c!=null)await glyphPop(c,"✦")}
 {const nTG=tgCounts(D);for(const[k,v]of nTG){const o=oTG.get(k);if(o&&o.e===v.e&&o.b===v.b&&o.l===v.l)continue;
  feed("found",_t("tg",{p:v.naam}),o?_t("tgD",{e:(v.e-o.e>0?"+":"")+(v.e-o.e),b:(v.b-o.b>0?"+":"")+(v.b-o.b),l:(v.l-o.l>0?"+":"")+(v.l-o.l)}):_t("tgNew"));
  for(const s of L.slots.values()){const p=P[s.i];if((p.woon||[]).some(w=>fold(w[0]).includes(fold(v.naam))))flash(segEl(s.code),"scanned")}await wait(700)}}
 for(const x of ch.rename){feed("fix",_t("renamed",{a:x.from,b:x.to}),"");const c=codeOf(x.k);if(c!=null){flash(lblEl(c),"mat");const[sx,sy]=slotScr(c);burst(sx,sy,30,css("--gold2"),2);await wait(600)}}
 for(const x of ch.dates){const c=codeOf(x.k);feed("fix",_t("dates",{n:nameOfK(P,x.k)}),`${x.from||"?"} → ${x.to||"?"}`);if(c!=null){flash(segEl(c),"scanned");callout(c,`<b>${esc(nameOfK(P,x.k))}</b><s>${esc(x.from||"?")}</s> → ${esc(x.to||"?")}`,"amber",3600);await wait(900)}}
 for(const[list,g,t]of[[ch.story,"✦","story"],[ch.media,"▣","media"],[ch.job.map(j=>j.k),"⚒","job"]]){for(const k of list){const c=codeOf(k),j=ch.job.find(q=>q.k===k);
  feed("found",_t(t,{n:nameOfK(P,k)}),t==="job"&&j?j.j:"");if(c!=null){await glyphPop(c,g)}}}
 renderCounts()}

/* ===== START PERSON ===== */
function setRoot(k){ROOT=k;LS.set("ftrLiveRoot:"+(startKey(P,D)||""),k);fxClear();render();beamsReattach()}
function rootPick(){const d=$("#rootDlg"),starts=(D.startpersonen||[]).map(s=>typeof s==="number"?s:s.persoon).filter(i=>P[i]);
 const row=i=>`<button type="button" data-k="${esc(key(P[i],i))}" class="${key(P[i],i)===ROOT?"on":""}"><b>${esc(P[i].n)}</b><span>${esc(yrs(P[i]))}</span></button>`;
 d.innerHTML=`<h2>${esc(_t("pick"))}</h2><div class="plist" id="pl1">${starts.map(row).join("")}</div><input type="search" id="pq" placeholder="${esc(_t("find"))}" autocomplete="off"><div class="plist" id="pl2"></div>`;
 const wire=()=>d.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{d.close();setRoot(b.dataset.k)});
 d.querySelector("#pq").oninput=e=>{const q=fold(e.target.value).trim();d.querySelector("#pl2").innerHTML=q.length<2?"":P.map((p,i)=>[p,i]).filter(([p])=>fold(p.n+" "+(p.aka||[]).join(" ")).includes(q)).slice(0,30).map(([,i])=>row(i)).join("");wire()};
 wire();d.addEventListener("click",e=>{if(e.target===d)d.close()});d.showModal()}

/* ===== REPLAY: the whole session again, from the tree as it was when the Workshop started (server keeps it) */
let REPLAY=false,PAUSED=false;
const hhmm=t=>{const d=new Date(t*1000);return d.toLocaleTimeString(LANG==="nl"?"nl-NL":"en-GB",{hour:"2-digit",minute:"2-digit"})};
async function replay(){if(REPLAY)return;let s;try{const r=await fetch("session",{cache:"no-store"});if(!r.ok)return;s=await r.json()}catch(e){return}
 const evs=s.events.filter(e=>e.kind!=="data"||e.n!=null);
 if(!evs.length){callout(null,`<b>${esc(_t("replayT"))}</b>${esc(_t("replayEmpty"))}`,"",3000);return}
 REPLAY=true;PAUSED=false;QUEUE.length=0;const bar=$("#rbar");bar.hidden=false;$("#rbTime").textContent=_t("replayWait");$("#rbFill").style.width="0";
 for(let k=0;busy&&k<200;k++)await new Promise(r=>setTimeout(r,100)); /* let the animation that is playing finish first */
 let d0;try{d0=await(await fetch("session/data/0",{cache:"no-store"})).json()}catch(e){REPLAY=false;return}
 D=d0;P=prep(d0);checked.clear();warned.clear();trayIds.length=0;for(const f of FOCUS.values())clearTimeout(f.timer);FOCUS.clear();
 for(const t of TASKS.values())t.el.remove();TASKS.clear();$("#feed").innerHTML="";$("#src").innerHTML="";fxClear();lastCounts=null;lastCert=null;render();
 $("#rbPause").textContent="❚❚";$("#rbLive").classList.remove("on");
 const t0=s.start,t1=evs[evs.length-1].t||t0;
 for(let k=0;k<evs.length&&REPLAY;k++){const ev=evs[k];
  $("#rbTime").textContent=`${hhmm(ev.t||t0)} · ${hhmm(t0)} – ${hhmm(t1)}`;$("#rbFill").style.width=(100*(k+1)/evs.length).toFixed(1)+"%";
  try{if(ev.kind==="data"){const dd=await(await fetch("session/data/"+ev.n,{cache:"no-store"})).json();await dataChanged(dd)}
   else if(ev.kind==="progress"){progress(ev);await wait(60)}
   else await handle(ev)}catch(e){console.error(e)}
  while(PAUSED&&REPLAY)await new Promise(r=>setTimeout(r,150))}
 if(!REPLAY)return;$("#rbTime").textContent=_t("replayDone");$("#rbLive").classList.add("on")}
function replayWire(){const b=$("#replayBtn");b.title=b.ariaLabel=_t("replayBtn");b.onclick=replay;
 $("#rbPause").onclick=()=>{PAUSED=!PAUSED;$("#rbPause").textContent=PAUSED?"▶":"❚❚"};
 $$("#rbar [data-sp]").forEach(x=>x.onclick=()=>{SPEED=+x.dataset.sp;$$("#rbar [data-sp]").forEach(y=>y.classList.toggle("on",y===x))});
 $("#rbLive").onclick=()=>{REPLAY=false;location.reload()}}  /* back to live: the page starts fresh from the server (log, tree, bars) */
/* ===== PHONE: a QR code of the phone address (only on the computer that runs the Workshop; /phone refuses others) */
let PHONE=undefined;
async function phoneAsk(){try{const r=await fetch("phone",{cache:"no-store"});if(!r.ok)return null;const j=await r.json();PHONE=j.url||null;return j}catch(e){return null}}
async function phoneInit(){if(!await phoneAsk())return;const b=$("#phoneBtn");b.hidden=false;b.title=b.ariaLabel=_t("phoneBtn");b.onclick=phoneShow}
/* the QR code in the Workshop's own look: round dots, rounded finder eyes in clay; styles for the choice sheet */
const QR_STYLES={2:{bg:"#2a2826",dot:"#f6e7dc",eye:"#e08a68",card:"#2a2826"}}; /* dark card, light dots, clay eyes (chosen from three) */
function qrSvg(q,st){const n=q.getModuleCount(),m=2,W=n+2*m,eye=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);let d="";
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!eye(r,c)&&q.isDark(r,c))d+=`<circle cx="${c+m+.5}" cy="${r+m+.5}" r=".42"/>`;
 const e=(x,y)=>`<rect x="${x+.5}" y="${y+.5}" width="6" height="6" rx="1.8" fill="none" stroke="${st.eye}" stroke-width="1"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".9" fill="${st.eye}"/>`;
 return`<svg viewBox="0 0 ${W} ${W}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${W}" rx="2" fill="${st.bg}"/><g fill="${st.dot}">${d}</g>${e(m,m)}${e(m+n-7,m)}${e(m,m+n-7)}</svg>`}
function qrLib(){return window.qrcode?Promise.resolve(true):new Promise(res=>{const s=document.createElement("script");
 s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";s.onload=()=>res(!!window.qrcode);s.onerror=()=>res(false);document.head.append(s)})}
async function phoneShow(){const j=await phoneAsk()||{};const d=$("#phoneDlg");d.innerHTML=`<button type="button" class="x" aria-label="×">×</button><h2>${esc(_t("phoneT"))}</h2>`;
 d.querySelector(".x").onclick=()=>d.close();d.addEventListener("click",e=>{if(e.target===d)d.close()});
 if(!PHONE){d.insertAdjacentHTML("beforeend",`<p>${esc(_t(j.why==="nonet"?"phoneNoNet":"phoneOff"))}</p>`);d.showModal();return}
 d.insertAdjacentHTML("beforeend",`<p>${esc(_t("phoneP"))}</p><div class="qr"></div><p>${esc(_t("phoneOnce"))}</p><code>${esc(PHONE)}</code>`);d.showModal();
 if(await qrLib()){const q=qrcode(0,"M");q.addData(PHONE);q.make();const st=QR_STYLES[CFG.QR_STYLE],box=d.querySelector(".qr");box.style.background=st.card;box.innerHTML=qrSvg(q,st)}
 else{d.querySelector(".qr").remove();d.querySelector("code").insertAdjacentHTML("beforebegin",`<p>${esc(_t("phoneNoQR"))}</p>`)}}
/* ===== START ===== */
function pickLang(d){let l=null;try{l=new URLSearchParams(location.search).get("lang")}catch(e){}if(l!=="nl"&&l!=="en")l=LS.get(LANG_KEY);
 return(l==="nl"||l==="en")?l:((d&&(d.taal||d.lang))==="nl"?"nl":"en")}
const LANG_KEY="stamboomLang"; /* the viewer's key: one choice for both, they share an origin under live.py */
function langMark(){$$("#langsw [data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===LANG?"true":"false"))}
function chooseLang(l){if(l!=="en"&&l!=="nl")return;LS.set(LANG_KEY,l);if(l===LANG){langMark();return}
 LANG=l;document.documentElement.lang=l;applyTexts();langMark();render();beamsReattach()}
function setLang(d){const nl=pickLang(d);
 if(nl!==LANG){LANG=nl;document.documentElement.lang=LANG;applyTexts();langMark()}}
async function start(){const d=await fetchData();if(!d){$("#feed").innerHTML=`<li class="empty">data.json?</li>`;return}
 D=d;P=prep(d);LANG=pickLang(d);document.documentElement.lang=LANG;$$("#langsw [data-l]").forEach(b=>b.onclick=()=>chooseLang(b.dataset.l));langMark();
 const saved=LS.get("ftrLiveRoot:"+(startKey(P,D)||""));ROOT=saved&&idx(P,saved)>=0?saved:startKey(P,D);
 {let v=null;try{v=new URLSearchParams(location.search).get("view")}catch(e){}VIEW=(v||LS.get("ftrLiveView"))==="fan"?"fan":"cosmos";}
 $$("#vsw button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.v===VIEW?"true":"false");b.onclick=()=>setView(b.dataset.v)});wireTap();
 applyTexts();render();
 if(!P.length)feed("note",_t("empty"),"");
 $("#rootBtn").onclick=rootPick;phoneInit();replayWire();
 connect()}
function connect(){const pill=$("#pill"),pt=$("#pillT");let es;
 try{es=new EventSource("events")}catch(e){pt.textContent=_t("offline");return}
 es.onopen=()=>{pill.classList.add("on");pt.textContent=_t("live")};
 es.onerror=()=>{pill.classList.remove("on");pt.textContent=_t("offline")};
 let first=true;es.onmessage=m=>{if(REPLAY)return;let ev;try{ev=JSON.parse(m.data)}catch(e){return}
  if(ev.kind==="hello"&&!first){enqueue({kind:"data"});return} /* reconnected: catch up on the data, not the old log */
  first=false;enqueue(ev)}}
start();
</script>
