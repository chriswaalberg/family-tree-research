<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workshop</title>
<!-- The Workshop (Claude Code only): served by scripts/live.py, never published. It shows the start person's round Fan and
     animates every change in data.json; archives.py, delpher.py, gedcom_tool.py and `live.py note` send what Claude is doing. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060914;--bg2:#121a3a;--ink:#efe8d6;--mut:#8f95ad;--gold:#f5c45a;--gold2:#fff0c0;--teal:#5fe0c8;--red:#ff5d5d;--amber:#ffb03b;--blue:#8fbcff;
 --slot:rgba(255,255,255,.05);--slotS:rgba(239,232,214,.2);--ghost:rgba(239,232,214,.13);--panel:rgba(14,20,46,.8);--line:rgba(239,232,214,.12);
 --fa:rgba(127,178,255,.10);--mo:rgba(255,140,170,.09);--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse 80% 70% at 38% 48%,var(--bg2),var(--bg) 72%) fixed;color:var(--ink);font:14px/1.45 var(--sans);
 display:grid;grid-template-rows:auto 1fr;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#stars,#fx{position:fixed;inset:0;pointer-events:none}#stars{z-index:0;transition:opacity .8s}#fx{z-index:50}
header,main{position:relative;z-index:1}
header{display:flex;align-items:center;gap:10px 22px;padding:12px 20px 6px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.hbtns{display:flex;gap:6px;align-self:flex-start}
.brand h1{font:700 28px/1 var(--serif);margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rootbtn{font:italic 500 17px var(--serif);color:var(--mut);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left}
.rootbtn b{font-style:normal;font-weight:700;color:var(--ink);border-bottom:1px dashed var(--mut)}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 10px var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);padding:4px 9px;border-radius:99px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.on i{background:var(--red);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,93,93,.7)}100%{box-shadow:0 0 0 10px rgba(255,93,93,0)}}
.hbtn{font:600 12px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;text-decoration:none}
.hbtn:hover{border-color:var(--gold)}
.counts{display:flex;gap:8px;margin-left:auto}
.cnt{min-width:84px;padding:5px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.cnt b{display:block;font:700 27px/1 var(--serif)}
.cnt span{display:block;font:600 9.5px var(--sans);letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt.bump b{animation:bump 1.1s ease-out}.cnt.down b{animation:down 1.1s ease-out}
@keyframes bump{0%{color:var(--gold2);text-shadow:0 0 18px var(--gold)}100%{}}
@keyframes down{0%{color:var(--red)}100%{}}
main{display:grid;grid-template-columns:1fr minmax(300px,370px);min-height:0}
#stage{position:relative;min-height:0}
#fan{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
aside{display:flex;flex-direction:column;gap:10px;padding:6px 18px 14px 0;min-height:0}
#src:empty,#tasks:empty{display:none}
#tasks{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.task{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;transition:opacity .8s}
.task b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task span{font:600 11px var(--sans);color:var(--mut);white-space:nowrap}
.task small{grid-column:1/-1;color:var(--mut);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.task .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 10px var(--gold);transition:width .6s ease-out}
.task.done{opacity:0}
.card{position:relative;padding:12px 54px 12px 16px;border-radius:12px;color:var(--ink);
 background:linear-gradient(135deg,rgba(245,196,90,.13),rgba(14,20,46,.88) 55%);border:1px solid rgba(245,196,90,.45);
 box-shadow:0 0 34px rgba(245,196,90,.14),inset 0 1px 0 rgba(255,240,192,.15);transform-origin:top center;animation:unfold .9s cubic-bezier(.2,.9,.3,1.2)}
.card small{display:block;font:700 10px var(--sans);letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.card div{font:600 italic 18px/1.25 var(--serif);margin-top:3px;overflow-wrap:anywhere;color:var(--gold2)}
.card .seal{position:absolute;right:14px;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;
 color:var(--gold2);font:700 13px var(--serif);box-shadow:0 0 16px rgba(245,196,90,.5),inset 0 0 10px rgba(245,196,90,.35);animation:seal 2.6s ease-in-out infinite}
@keyframes seal{50%{box-shadow:0 0 26px rgba(245,196,90,.8),inset 0 0 14px rgba(245,196,90,.5)}}
.card.none{background:rgba(14,20,46,.7);border-color:var(--line);box-shadow:none}.card.none small{color:var(--mut)}.card.none div{color:var(--mut)}
@keyframes unfold{0%{transform:rotateX(-80deg) translateY(-24px);opacity:0}100%{transform:none;opacity:1}}
.feedwrap{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.feedwrap h2{margin:0;padding:9px 14px;font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
#feed{list-style:none;margin:0;padding:4px 0;overflow:auto;flex:1}
#feed li{display:flex;gap:10px;padding:7px 14px;border-left:3px solid transparent;animation:slide .45s ease-out}
#feed li.q{animation:none}
#feed li .ic{width:18px;flex:none;text-align:center;color:var(--mut)}
#feed li b{display:block;font-weight:600}
#feed li small{display:block;color:var(--mut);overflow-wrap:anywhere}
#feed li .who{display:inline-block;font:600 9.5px var(--sans);letter-spacing:1px;text-transform:uppercase;padding:1px 6px;border-radius:99px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
#feed li:last-child{background:linear-gradient(90deg,rgba(245,196,90,.10),transparent)}
#feed .k-search,#feed .k-read,#feed .k-scan,#feed .k-clip{border-color:var(--blue)}#feed .k-result{border-color:var(--line)}
#feed .k-check{border-color:var(--teal)}#feed .k-warn{border-color:var(--amber)}#feed .k-add{border-color:var(--gold)}
#feed .k-del{border-color:var(--red)}#feed .k-cert{border-color:var(--gold2)}#feed .k-fix{border-color:var(--amber)}#feed .k-note,#feed .k-found{border-color:var(--mut)}
#feed .k-ask{border-color:var(--red)}#feed .k-rebuild{border-color:var(--teal)}
#feed .empty{color:var(--mut);font-style:italic;justify-content:center;border:0;background:none}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
/* fan */
.slot{fill:var(--slot);stroke:var(--slotS);stroke-width:1;transition:fill .8s,stroke .8s;cursor:pointer}
.slot.fa{fill:var(--fa)}.slot.mo{fill:var(--mo)}
.slot.root{fill:rgba(245,196,90,.12);stroke:var(--gold);stroke-opacity:.6}
.slot.gap{fill:rgba(245,196,90,.02);stroke:var(--gold);stroke-opacity:.4;stroke-dasharray:3 5;animation:breathe 3.4s ease-in-out infinite;cursor:default}
@keyframes breathe{50%{stroke-opacity:.9;fill:rgba(245,196,90,.07)}}
.guide{fill:none;stroke:var(--ghost);stroke-dasharray:1 5;stroke-linecap:round}
.qm{fill:var(--gold);font:500 italic 16px var(--serif);text-anchor:middle;dominant-baseline:central;opacity:.5;animation:qm 3.4s ease-in-out infinite;pointer-events:none}
@keyframes qm{50%{opacity:.9}}
.lk{fill:none;stroke:var(--slotS);stroke-width:1.2;pointer-events:none}
.lk.w{stroke:var(--gold);stroke-width:2;stroke-dasharray:5 5}.lk.p{stroke:var(--gold);stroke-opacity:.6;stroke-width:1.6;stroke-dasharray:1 4;stroke-linecap:round}
.lk.z{stroke:var(--gold);stroke-width:3;filter:drop-shadow(0 0 4px var(--gold))}.lk.x{stroke:var(--red);stroke-width:2;stroke-dasharray:4 3}
.lbl{pointer-events:none}.lbl text{text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.nm{font-family:var(--serif);font-weight:700}.yr{font-family:var(--sans);fill:var(--mut)!important}
.gl{font-family:var(--sans);font-weight:600}.gl .ok{fill:var(--teal)}.gl .wa{fill:var(--amber)}.gl .gg{fill:var(--gold)}
.pending{opacity:0}
.slot.scanned{animation:scan 1.3s ease-out}@keyframes scan{0%{fill:rgba(95,224,200,.5);stroke:var(--teal);stroke-width:2}100%{}}
.slot.gaphot{animation:gaphot 1.5s ease-out}@keyframes gaphot{0%{fill:rgba(245,196,90,.35);stroke-opacity:1;stroke-width:2}100%{}}
.slot.warnflash{animation:warn 2.4s ease-out}@keyframes warn{0%,30%{fill:rgba(255,176,59,.55);stroke:var(--amber);stroke-width:2.5}100%{}}
.slot.ignite{animation:ign 2s ease-out}@keyframes ign{0%{fill:var(--gold2);stroke:var(--gold2);stroke-width:3}100%{}}
.lbl.mat{animation:mat 1.6s ease-out}@keyframes mat{0%{opacity:0;filter:blur(8px)}100%{opacity:1;filter:blur(0)}}
.lbl.out{transition:opacity .6s,filter .6s;opacity:0;filter:blur(6px)}
.slot.broken{fill:rgba(255,93,93,.22)!important;stroke:var(--red)!important;stroke-width:2!important}
.crack{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linejoin:bevel;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-in forwards;filter:drop-shadow(0 0 5px var(--red))}
@keyframes draw{to{stroke-dashoffset:0}}
.stamp{font:700 13px var(--sans);letter-spacing:3px;fill:rgba(255,93,93,.12);stroke:var(--red);stroke-width:1;text-anchor:middle;dominant-baseline:central;transform-box:fill-box;transform-origin:center;animation:thump .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes thump{0%{transform:scale(2.6);opacity:0}100%{transform:scale(1);opacity:1}}
.lk.flare{animation:flare 2.6s ease-out}@keyframes flare{0%{stroke:var(--gold2);stroke-width:12;filter:drop-shadow(0 0 16px var(--gold))}100%{}}
.lk.flarex{animation:flarex 2.6s ease-out}@keyframes flarex{0%{stroke:var(--red);stroke-width:10}100%{}}
.wave{fill:none;stroke:var(--gold);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:wave 1.3s ease-out forwards;pointer-events:none}
@keyframes wave{0%{transform:scale(.1);opacity:1;stroke-width:6}100%{transform:scale(1);opacity:0;stroke-width:.5}}
.beam{pointer-events:none;transition:opacity 1.2s}.beam.idle{opacity:0}
.beam text{font:600 12px var(--sans);letter-spacing:1px;text-anchor:middle;dominant-baseline:central}
.beam .tip{animation:tip 1.4s ease-in-out infinite}@keyframes tip{50%{opacity:.4}}
.fxfade{transition:opacity .7s;opacity:0}
/* tray, callouts, overlay */
#tray{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:6px;max-width:min(270px,60%)}
#tray h3{margin:0 0 2px;font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
#tray:not(.has){display:none}
.orb{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--panel);border:1px solid rgba(245,196,90,.35);animation:orbIn .6s cubic-bezier(.2,1.4,.4,1);min-width:0}
.orb i{flex:none;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold2),var(--gold));box-shadow:0 0 14px var(--gold)}
.orb span{min-width:0}.orb b{display:block;font:700 14px/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.orb small{display:block;color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orb.rej{border-color:rgba(255,93,93,.4);opacity:.75}.orb.rej i{background:radial-gradient(circle at 35% 35%,#c9c3b8,#6d6a66);box-shadow:none}.orb.rej b{text-decoration:line-through;text-decoration-color:var(--red)}
@keyframes orbIn{from{transform:scale(.3);opacity:0}}
.flyer{position:fixed;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;z-index:60;pointer-events:none;background:radial-gradient(circle at 35% 35%,#fff,var(--gold2) 40%,var(--gold));box-shadow:0 0 30px 8px var(--gold)}
.bigg{position:fixed;left:0;top:0;z-index:60;pointer-events:none;font:700 50px var(--sans);color:var(--gold);text-shadow:0 0 24px var(--gold)}
.co{position:absolute;z-index:5;max-width:min(250px,70%);padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:13px;animation:pop .45s cubic-bezier(.2,1.5,.4,1);transition:opacity .6s;pointer-events:none}
.co b{display:block;font:700 15px var(--serif)}.co.amber{border-left-color:var(--amber)}.co.red{border-left-color:var(--red)}.co.teal{border-left-color:var(--teal)}
.co s{color:var(--red)}.co.bye{opacity:0}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);z-index:8;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s,transform .6s;width:max-content;max-width:92%}
#ov.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ov .box{padding:18px 28px;border-radius:18px;background:var(--panel);border:1px solid rgba(245,196,90,.4);box-shadow:0 0 80px rgba(245,196,90,.18)}
#ov h4{margin:0;font:700 30px var(--serif)}#ov p{margin:4px 0 0;color:var(--mut)}
#ov .st{display:flex;gap:20px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#ov .st b{display:block;font:700 30px/1 var(--serif);color:var(--gold)}#ov .st span{font:600 9.5px var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(420px,92vw);max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 10px;font:700 22px var(--serif)}
dialog input{width:100%;font:15px var(--sans);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin:8px 0}
.plist{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.plist button{display:flex;justify-content:space-between;gap:10px;text-align:left;font:14px var(--sans);color:var(--ink);background:none;border:1px solid transparent;border-radius:9px;padding:7px 10px;cursor:pointer}
.plist button:hover,.plist button.on{border-color:var(--gold)}.plist span{color:var(--mut);white-space:nowrap}
@media (max-width:900px){
 body{overflow:auto;display:block}
 header{padding:10px 14px 4px;gap:8px}
 .brand h1{font-size:23px}
 .counts{margin-left:0;width:100%;gap:6px}.cnt{flex:1;min-width:0;padding:4px 8px}.cnt b{font-size:21px}.cnt span{font-size:8px;letter-spacing:.5px}
 .rootbtn{font-size:15px}
 main{display:block}
 #stage{height:min(100vw,72vh)}
 aside{padding:0 12px 18px}
 .feedwrap{max-height:none}#feed{max-height:52vh}
 #tray{position:static;max-width:none;margin:6px 12px 0}
}
</style></head>
<body>
<canvas id="stars"></canvas><canvas id="fx"></canvas>
<header>
 <div class="brand">
  <h1><span data-t="title">Workshop</span><span class="pill" id="pill"><i></i><span id="pillT">…</span></span></h1>

 </div>
 <div class="hbtns"><a class="hbtn" id="viewerBtn" href="viewer/" target="_blank" rel="noopener"><span data-t="viewer">Viewer</span> ↗</a></div>

  <div class="cnt" id="c-p"><b>–</b><span data-t="people">people</span></div>

 </div>
</header>

 <div id="stage">

 </div>

 </aside>
</main>

 const[sx,sy]=slotScr(c);burst(sx,sy,40,css("--red"),3.5);await wait(700);ash(sx,sy,90);const l=lblEl(c);if(l)l.classList.add("out");await wait(700)}
function fxClear(){for(const e of[...$("#fxG").children]){if(e.classList.contains("beam"))continue;e.classList.add("fxfade");setTimeout(()=>e.remove(),700)}}
async function glyphPop(c,g){const el=svg.querySelector(`.lbl[data-c="${c}"] [data-g="${g}"]`),[sx,sy]=slotScr(c);let tx=sx,ty=sy;
 if(el){const r=el.getBoundingClientRect();tx=r.left+r.width/2;ty=r.top+r.height/2;el.style.opacity=0}
 const d=document.createElement("div");d.className="bigg";d.textContent=g;document.body.append(d);const w=d.offsetWidth,h=d.offsetHeight;
 await tween(900,k=>{const e=1-Math.pow(1-k,3),x=sx+(tx-sx)*e,y=sy-90*(1-e)+(ty-sy)*e,s=2-1.7*e;d.style.transform=`translate(${x-w/2}px,${y-h/2}px) scale(${s})`;d.style.opacity=Math.min(1,k*4)});
 d.remove();if(el)el.style.opacity="";burst(tx,ty,30,css("--gold"),2.4)}

/* ===== BEAMS: one per helper ("who"), pointing at the person being searched ===== */
const BEAMS=new Map(),BEAM_COL=["--teal","--blue","--amber","--gold2","--red"];
function beamFor(who){who=who||"";if(BEAMS.has(who))return BEAMS.get(who);const col=css(BEAM_COL[BEAMS.size%BEAM_COL.length]),g=document.createElementNS(NS,"g");g.setAttribute("class","beam idle");
 const R=CFG.RMAX+14;let h="";for(let i=0;i<10;i++){const a0=-(i+1)*2.4,a1=-i*2.4,[x1,y1]=pt(R,a0),[x2,y2]=pt(R,a1);h+=`<path d="M0 0L${x1} ${y1}A${R} ${R} 0 0 1 ${x2} ${y2}Z" fill="${col}" opacity="${(.3*(1-i/10)).toFixed(3)}"/>`}
 h+=`<line x1="0" y1="0" x2="0" y2="${-R}" stroke="${col}" stroke-width="2.5" style="filter:drop-shadow(0 0 6px ${col})"/><circle class="tip" cx="0" cy="${-R}" r="6" fill="${col}"/>`;
 if(who)h+=`<text x="0" y="${-R-16}" fill="${col}">${esc(who)}</text>`;g.innerHTML=h;$("#fxG").append(g);
 const b={g,a:0,timer:null,anim:0};BEAMS.set(who,b);return b}
function beamAim(who,c){const b=beamFor(who),s=slotAt(c),target=s?(s.lo+s.hi)/2:null;b.g.classList.remove("idle");clearTimeout(b.timer);b.timer=setTimeout(()=>b.g.classList.add("idle"),CFG.BEAM_IDLE);
 const my=++b.anim,from=b.a;let to=target==null?from+360:target;if(target!=null){let d=((to-from)%360+540)%360-180;to=from+d}
 tween(target==null?2600:1100,k=>{if(my!==b.anim)return;const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;b.a=from+(to-from)*e;b.g.setAttribute("transform",`rotate(${b.a.toFixed(2)})`);
  const t=b.g.querySelector("text");if(t)t.setAttribute("transform",`rotate(${(-b.a).toFixed(2)} 0 ${-(CFG.RMAX+30)})`)}).then(()=>{if(my===b.anim&&s){flash(segEl(c),"scanned")}})}
function beamsReattach(){for(const b of BEAMS.values())$("#fxG").append(b.g)}
/* who is meant: a GEDCOM id, else the person in the fan whose first name and surname both appear in the query */
const fold=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ");
function findTarget(person,q){if(person){const k=String(person).replace(/@/g,"");const c=codeOf(k);if(c!=null)return c;q=q||person}
 if(!q)return null;const words=new Set(fold(q).split(/\s+/).filter(Boolean));let best=null,score=0;
 for(const s of L.slots.values()){const p=P[s.i],fn=fold(first(p)),sn=fold(p.s||"").split(/\s+/).filter(w=>w.length>2);
  const sc=(words.has(fn)?2:0)+(sn.length&&sn.every(w=>words.has(w))?2:0)+(p.by&&q.includes(String(p.by))?1:0);if(sc>score&&sc>=4){score=sc;best=s.code}}
 return best}

/* ===== FEED ===== */
function feed(kind,title,detail,who,quiet){const f=$("#feed");f.querySelector(".empty")?.remove();const li=document.createElement("li");li.className="k-"+kind+(quiet?" q":"");
 const ic={search:"⌕",read:"❐",scan:"▤",clip:"✂",result:"↳",check:"✓",warn:"!",add:"✦",del:"✕",cert:"◆",fix:"✎",note:"✎",ask:"?",found:"★",rebuild:"⟳"}[kind]||"·";
 li.innerHTML=`<span class="ic">${ic}</span><div><b>${esc(title)}${who?`<span class="who">${esc(who)}</span>`:""}</b>${detail?`<small>${esc(detail)}</small>`:""}</div>`;
 f.append(li);while(f.children.length>CFG.FEED)f.firstChild.remove();f.scrollTop=f.scrollHeight}
function feedEmpty(){const f=$("#feed");if(!f.children.length)f.innerHTML=`<li class="empty">${esc(_t("waiting"))}</li>`}
function describe(ev){const src=ev.source||"";
 switch(ev.kind){
  case"search":case"read":case"scan":case"clip":if(!src&&ev.text)return[ev.kind,ev.text,ev.q||""];return[ev.kind,_t(ev.kind,{src}),[ev.q,ev.place,(ev.frm||ev.to)?`${ev.frm||""}–${ev.to||""}`:""].filter(Boolean).join(" · ")];
  case"result":return["result",_t(ev.n?"result":"result0",{n:ev.n,src}),ev.q||""];
  case"check":return["check",_t("check"),_t("checkD",{p:ev.people,g:ev.gaps,o:ev.odd})];
  case"warn":return["warn",_t("warn"),ev.text||""];
  case"rebuild":return["rebuild",_t("rebuild"),_t("rebuildD",{t:ev.title||"",s:ev.steps,p:ev.people})];
  case"progress":return["rebuild",_t(ev.done>=ev.total?"taskDone":"taskStart",{t:ev.task||""}),`${ev.done} / ${ev.total}`+(ev.text?" · "+ev.text:"")];
  case"note":case"ask":case"found":return[ev.kind,ev.kind==="note"?ev.text:_t(ev.kind),ev.kind==="note"?"":ev.text];
 }return null}

/* ===== QUEUE: events play one after another, so the fan and the log stay in step ===== */
/* ===== TASKS: progress bars of long scripts (not queued: they follow the script live) ===== */
const TASKS=new Map();
function progress(ev,quiet){const name=String(ev.task||"");let t=TASKS.get(name);const now=Date.now()/1000;
 if(!t){t={t0:ev.t||now,d0:ev.done,el:document.createElement("div"),who:"",person:null};t.el.className="task";$("#tasks").append(t.el);TASKS.set(name,t);
  if(!quiet&&ev.done<ev.total)feed("rebuild",_t("taskStart",{t:name}),`${ev.done} / ${ev.total}`,ev.who)}
 const pct=ev.total?Math.min(100,100*ev.done/ev.total):0,el_=(ev.t||now)-t.t0,rate=el_>5?(ev.done-t.d0)/el_:0,left=rate>0?(ev.total-ev.done)/rate:null;
 const eta=left==null?"":left<60?_t("etaS"):_t("eta",{m:Math.round(left/60)});
 t.el.innerHTML=`<b>${esc(name)}</b><span>${ev.done} / ${ev.total}${eta?" · "+esc(eta):""}</span><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>${ev.text?`<small>${esc(ev.text)}</small>`:""}`;
 if(ev.person&&ev.person!==t.person&&L){t.person=ev.person;const c=findTarget(ev.person,ev.text);if(c!=null)beamAim(ev.who||name,c)}
 if(ev.total&&ev.done>=ev.total){if(!quiet)feed("rebuild",_t("taskDone",{t:name}),`${ev.done} / ${ev.total}`,ev.who);t.el.classList.add("done");TASKS.delete(name);setTimeout(()=>t.el.remove(),1200)}}
const QUEUE=[];let busy=false;
function enqueue(ev){if(ev.kind==="progress")return progress(ev);if(ev.kind==="data"&&QUEUE.some(e=>e.kind==="data"))return;QUEUE.push(ev);if(!busy)drain()}
async function drain(){busy=true;while(QUEUE.length){const ev=QUEUE.shift();try{await handle(ev)}catch(e){console.error(e)}}busy=false}
async function handle(ev){
 if(ev.kind==="hello"){for(const h of ev.history||[]){const d=describe(h);if(d)feed(d[0],d[1],d[2],h.who,true)}feedEmpty();for(const t of ev.tasks||[])progress(t,true);return}
 if(ev.kind==="data")return dataChanged();
 const d=describe(ev);if(!d)return;feed(d[0],d[1],d[2],ev.who);
 if(["search","read","scan","clip","note","found","ask"].includes(ev.kind)){const c=findTarget(ev.person,ev.q||ev.text);if(c!=null||ev.kind!=="note")beamAim(ev.who,c);
  if(ev.kind==="ask")callout(c,`<b>${esc(_t("ask"))}</b>${esc(ev.text||"")}`,"red",8000);await wait(500);return}
 if(ev.kind==="check")return sweep(ev);
 if(ev.kind==="warn"){const c=findTarget(ev.person);if(c!=null){const k=slotAt(c).k;warned.add(k);flash(segEl(c),"warnflash");const[x,y]=slotScr(c);burst(x,y,40,css("--amber"),3);
  callout(c,`<b>${esc(_t("warn"))}</b>${esc(ev.text||"")}`,"amber",6000);render();flash(segEl(c),"warnflash");await wait(1500)}return}
 await wait(200)}
async function sweep(ev){const b=beamFor(ev.who);b.g.classList.remove("idle");clearTimeout(b.timer);b.anim++;
 const tg=[...L.slots.values(),...L.gaps].map(s=>({s,a:s.code===""?0:(s.lo+s.hi)/2,done:false})).sort((p,q)=>p.a-q.a),from=0;
 await tween(CFG.SWEEP_MS,k=>{const a=from+k*360;b.a=a;b.g.setAttribute("transform",`rotate(${a})`);
  for(const t of tg)if(!t.done&&a>=t.a){t.done=true;const el=segEl(t.s.code);if(t.s.k){checked.add(t.s.k);flash(el,"scanned");if(tg.length<400){const[x,y]=slotScr(t.s.code);burst(x,y,14,css("--teal"),2,40)}}else flash(el,"gaphot")}});
 b.timer=setTimeout(()=>b.g.classList.add("idle"),4000);render();beamsReattach();
 await overlay(`<h4>${esc(_t("checkT"))}</h4><p>${esc(_t("checkP"))}</p><div class="st"><div><b>${ev.people??"–"}</b><span>${esc(_t("people"))}</span></div><div><b>${ev.gaps??"–"}</b><span>${esc(_t("open"))}</span></div><div><b>${ev.odd??"–"}</b><span>${esc(_t("worth"))}</span></div></div>`,2800)}

/* ===== DIFF: what changed between the old and the new data.json, played on the fan ===== */
async function fetchData(){for(let n=0;n<6;n++){try{const r=await fetch("data.json?v="+Date.now(),{cache:"no-store"});if(r.ok)return await r.json()}catch(e){}await wait(500)}return null}
function diffOf(oP,nP){const oi=new Map(oP.map((p,i)=>[key(p,i),i])),ni=new Map(nP.map((p,i)=>[key(p,i),i])),par=(Pa,i,s)=>{const j=Pa[i][s];return j>=0?key(Pa[j],j):null};
 const ch={added:[],removed:[],linkAdd:[],linkDel:[],cert:[],rename:[],dates:[],story:[],media:[],job:[]};
 for(const[k,i]of ni){if(!oi.has(k)){ch.added.push(k)}else{const j=oi.get(k),o=oP[j],n=nP[i];
  if(o.n!==n.n)ch.rename.push({k,from:o.n,to:n.n});
  if((o.bdate||"")!==(n.bdate||"")||(o.ddate||"")!==(n.ddate||""))ch.dates.push({k,from:[o.bdate,o.ddate].filter(Boolean).join(" – "),to:[n.bdate,n.ddate].filter(Boolean).join(" – ")});
  if(!o.verhaal&&n.verhaal)ch.story.push(k);if((o.media||[]).length<(n.media||[]).length)ch.media.push(k);
  if((o.beroep||[]).length<(n.beroep||[]).length)ch.job.push({k,j:n.beroep[n.beroep.length-1]})}
  for(const s of["f","m"]){const a=oi.has(k)?par(oP,oi.get(k),s):null,b=par(nP,i,s),nc=(nP[i].c&&nP[i].c[s])||[];
   if(a!==b){if(a)ch.linkDel.push({c:k,p:a,s});if(b)ch.linkAdd.push({c:k,p:b,s,src:nc[1]||"",st:normS(nc[0])})}
   else if(b){const oc=(oP[oi.get(k)].c&&oP[oi.get(k)].c[s])||[];if(normS(oc[0])!==normS(nc[0]))ch.cert.push({c:k,p:b,s,from:normS(oc[0]),to:normS(nc[0]),src:nc[1]||""})}}}
 for(const[k,i]of oi)if(!ni.has(k))ch.removed.push({k,p:oP[i]});return ch}
const nameOfK=(Pa,k)=>{const i=idx(Pa,k);return i<0?"?":short(Pa[i])};
async function dataChanged(){const d=await fetchData();if(!d)return;const oP=P,nP=prep(d);D=d;
 const ch=diffOf(oP,nP),oldL=L,oldFan=new Set(oldL.byId.keys());
 /* phase 1, on the old fan: links that went away crack, people that went away blow away */
 fxClear();
 for(const x of ch.linkDel){const cc=codeOf(x.c),pc=cc!=null?cc+x.s:null;feed("del",_t("unlinked",{p:nameOfK(oP,x.p),c:nameOfK(oP,x.c)}),"");
  if(pc!=null&&slotAt(pc)){beamAim("",pc);await crack(pc)}if(idx(nP,x.p)>=0)trayIds.push({k:x.p,rej:true,why:_t(x.s==="f"?"fatherOf":"motherOf",{c:nameOfK(nP,x.c)})})}
 for(const x of ch.removed){const c=codeOf(x.k),fn=fold(first(x.p)),sn=fold(x.p.s);
  const into=nP.findIndex(p=>fold(p.s)===sn&&(fold(p.n).includes(fn)||(p.aka||[]).some(a=>fold(a).includes(fn)))&&(!p.by||!x.p.by||Math.abs(p.by-x.p.by)<=5));
  if(into>=0){feed("fix",_t("merged",{a:short(x.p),b:short(nP[into])}),"");const tc=codeOf(key(nP[into],into));if(c!=null&&tc!=null){await fly(slotScr(c),tc);wave(tc)}}
  else{feed("del",_t("removed",{n:short(x.p)}),"");if(c!=null){const[sx,sy]=slotScr(c);ash(sx,sy,80);lblEl(c)?.classList.add("out");await wait(800)}}}
 /* phase 2: the new fan; newcomers start invisible and arrive one by one */
 P=nP;if(idx(P,ROOT)<0)ROOT=startKey(P,D);
 const newL=layout(P,ROOT),arrive=[...newL.byId.keys()].filter(k=>!oldFan.has(k)).sort((a,b)=>newL.slots.get(newL.byId.get(a)[0]).g-newL.slots.get(newL.byId.get(b)[0]).g);
 const trayPos=new Map($$("#tray .orb").map(o=>{const r=o.querySelector("i").getBoundingClientRect();return[o.dataset.k,[r.left+10,r.top+10]]}));
 fxClear();render(new Set(arrive));beamsReattach();
 if(newL.depth>oldL.depth&&oldL.slots.size){feed("add",_t("ring"),_t("ringD"))}
 const viaLink=new Map(ch.linkAdd.map(x=>[x.p,x]));let shown=0;
 for(const k of arrive){const c=codeOf(k),x=viaLink.get(k),i=idx(P,k),isNew=ch.added.includes(k);
  const ci=x?idx(P,x.c):-1,rel=x?_t(x.s==="f"?"fatherOf":"motherOf",{c:short(P[ci])}):"";
  if(shown<CFG.ONE_BY_ONE){shown++;feed("add",_t(isNew?"added":"linked",{n:short(P[i])}),[yrs(P[i]),rel,x&&x.st?_t("s_"+x.st):""].filter(Boolean).join(" · "));
   showSource(x?x.src:"");await wait(500);const from=trayPos.get(k)||srcPt()||scr(0,0);if(!trayPos.has(k)&&srcPt())await streamTo(srcPt(),slotScr(c),700);
   beamAim("",c);await fly(from,c);ignite(c);
   if(x&&x.st&&x.st!=="zeker"&&x.st!=="niet gecheckt")callout(c,`<b>${esc(_t("s_"+x.st))}</b>${esc(rel)}`,"",3200);await wait(450)}
  else ignite(c)}
 if(arrive.length>CFG.ONE_BY_ONE){feed("add",_t("many",{n:arrive.length-CFG.ONE_BY_ONE}),"");wave("",css("--gold2"));await wait(900)}
 if(arrive.length){const nGaps=L.gaps.filter(q=>arrive.includes(L.slots.get(q.code.slice(0,-1))?.k)).length;
  if(nGaps){for(const q of L.gaps)if(arrive.includes(L.slots.get(q.code.slice(0,-1))?.k))flash(segEl(q.code),"gaphot");callout(L.gaps.find(q=>arrive.includes(L.slots.get(q.code.slice(0,-1))?.k))?.code,`<b>${esc(_t("gapsNew",{n:nGaps}))}</b>${esc(_t("gapsNewD"))}`,"teal",3800);await wait(1200)}}
 /* new people outside the fan go to the tray */
 for(const k of ch.added){if(codeOf(k)!=null)continue;const i=idx(P,k);trayIds.push({k,why:_t("notInFan")});feed("add",_t("added",{n:short(P[i])}),[yrs(P[i]),_t("notInFan")].filter(Boolean).join(" · "))}
 if(ch.added.some(k=>codeOf(k)==null)){renderTray();$$("#tray .orb").forEach(o=>{const r=o.querySelector("i").getBoundingClientRect();burst(r.left+10,r.top+10,30,css("--gold"),2.5)})}
 for(const x of ch.cert){const cc=codeOf(x.c),pc=cc!=null?cc+x.s:null;feed("cert",_t("cert",{p:nameOfK(P,x.c),c:nameOfK(P,x.p),s:_t("s_"+x.to)}),_t("certFrom",{s:_t("s_"+(x.from||""))})+(x.src?" · "+x.src:""));
  if(pc==null||!slotAt(pc))continue;if(x.src)showSource(x.src);beamAim("",pc);const s=slotAt(pc);
  if(x.to==="fout"){flash(lkEl(pc),"flarex");const[sx,sy]=slotScr(pc);burst(sx,sy,40,css("--red"),3)}
  else{flash(lkEl(pc),"flare");for(let n=0;n<=12;n++){const[x2,y2]=scr(...pt(L.RI(s.g),s.lo+(s.hi-s.lo)*n/12));burst(x2,y2,7,css("--gold2"),1.8,55);await wait(35)}}
  callout(pc,`<b>${esc(_t("s_"+x.to))}</b>${x.to==="zeker"?esc(_t("gold")):""}`,x.to==="fout"?"red":"",3400);await wait(900)}
 for(const x of ch.rename){feed("fix",_t("renamed",{a:x.from,b:x.to}),"");const c=codeOf(x.k);if(c!=null){flash(lblEl(c),"mat");const[sx,sy]=slotScr(c);burst(sx,sy,30,css("--gold2"),2);await wait(600)}}
 for(const x of ch.dates){const c=codeOf(x.k);feed("fix",_t("dates",{n:nameOfK(P,x.k)}),`${x.from||"?"} → ${x.to||"?"}`);if(c!=null){flash(segEl(c),"scanned");callout(c,`<b>${esc(nameOfK(P,x.k))}</b><s>${esc(x.from||"?")}</s> → ${esc(x.to||"?")}`,"amber",3600);await wait(900)}}
 for(const[list,g,t]of[[ch.story,"✦","story"],[ch.media,"▣","media"],[ch.job.map(j=>j.k),"⚒","job"]]){for(const k of list){const c=codeOf(k),j=ch.job.find(q=>q.k===k);
  feed("found",_t(t,{n:nameOfK(P,k)}),t==="job"&&j?j.j:"");if(c!=null){await glyphPop(c,g)}}}
 renderCounts()}

/* ===== START PERSON ===== */
function setRoot(k){ROOT=k;LS.set("ftrLiveRoot:"+(startKey(P,D)||""),k);fxClear();render();beamsReattach()}
function rootPick(){const d=$("#rootDlg"),starts=(D.startpersonen||[]).map(s=>typeof s==="number"?s:s.persoon).filter(i=>P[i]);
 const row=i=>`<button type="button" data-k="${esc(key(P[i],i))}" class="${key(P[i],i)===ROOT?"on":""}"><b>${esc(P[i].n)}</b><span>${esc(yrs(P[i]))}</span></button>`;
 d.innerHTML=`<h2>${esc(_t("pick"))}</h2><div class="plist" id="pl1">${starts.map(row).join("")}</div><input type="search" id="pq" placeholder="${esc(_t("find"))}" autocomplete="off"><div class="plist" id="pl2"></div>`;
 const wire=()=>d.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{d.close();setRoot(b.dataset.k)});
 d.querySelector("#pq").oninput=e=>{const q=fold(e.target.value).trim();d.querySelector("#pl2").innerHTML=q.length<2?"":P.map((p,i)=>[p,i]).filter(([p])=>fold(p.n+" "+(p.aka||[]).join(" ")).includes(q)).slice(0,30).map(([,i])=>row(i)).join("");wire()};
 wire();d.addEventListener("click",e=>{if(e.target===d)d.close()});d.showModal()}

/* ===== START ===== */
async function start(){const d=await fetchData();if(!d){$("#feed").innerHTML=`<li class="empty">data.json?</li>`;return}
 D=d;P=prep(d);let l=null;try{l=new URLSearchParams(location.search).get("lang")}catch(e){}LANG=(l==="nl"||l==="en")?l:((d.taal||d.lang)==="nl"?"nl":"en");document.documentElement.lang=LANG;
 const saved=LS.get("ftrLiveRoot:"+(startKey(P,D)||""));ROOT=saved&&idx(P,saved)>=0?saved:startKey(P,D);
 applyTexts();render();
 if(!P.length)feed("note",_t("empty"),"");
 $("#rootBtn").onclick=rootPick;
 connect()}
function connect(){const pill=$("#pill"),pt=$("#pillT");let es;
 try{es=new EventSource("events")}catch(e){pt.textContent=_t("offline");return}
 es.onopen=()=>{pill.classList.add("on");pt.textContent=_t("live")};
 es.onerror=()=>{pill.classList.remove("on");pt.textContent=_t("offline")};
 let first=true;es.onmessage=m=>{let ev;try{ev=JSON.parse(m.data)}catch(e){return}
  if(ev.kind==="hello"&&!first){enqueue({kind:"data"});return} /* reconnected: catch up on the data, not the old log */
  first=false;enqueue(ev)}}
start();
</script>
